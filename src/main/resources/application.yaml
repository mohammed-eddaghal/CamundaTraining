spring:
  application:
    name: camundaTraining
  datasource:
    url: jdbc:h2:mem:camunda-db;DB_CLOSE_DELAY=-1
    username: sa
    password: sa
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

camunda.bpm:
  admin-user:
    id: admin
    password: admin
    firstName: Admin
    lastName: Admin
    email: admin@localhost
  filter:
    create: All tasks
  generic-properties:
    properties:
      enforceHistoryTimeToLive: false

